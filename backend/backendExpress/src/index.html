<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokeBuild</title>
    <link rel="stylesheet" href="./css/bootstrap.css">
    <link rel="stylesheet" href="./css/styles.css">
    <script src="./js/bootstrap.bundle.js" defer></script>
    <script src="./js/navbar.js" defer></script>
    <script src="./js/index_functions.js" defer></script>
</head>
<body>

    <nav class="navPrincipal">
    
        <!-- Franja superior: logo + título + buscador -->
        <div class="nav-top">
            <img src="./sources/icono_app.png" alt="Logo PokeBuild" id="imgLogo">
            <span id="tituloApp">PokeBuild</span>
            <div class="nav-separator"></div>
    
            <!-- Buscador -->
            <form class="d-flex" role="search" id="searchForm">
                <input class="form-control" type="search" placeholder="Buscar pokémon..." id="searchInput">
                <button class="btn-buscar" type="submit">Buscar</button>
            </form>
    
            <!-- Usuario -->
            <div id="navUserInfo"></div>
        </div>
    
        <!-- Franja inferior: navegación -->
        <div class="nav-bottom">
            <a class="nav-link active" href="#">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-house-fill"
                    viewBox="0 0 16 16">
                    <path
                        d="M8.707 1.5a1 1 0 0 0-1.414 0L.646 8.146a.5.5 0 0 0 .708.708L8 2.207l6.646 6.647a.5.5 0 0 0 .708-.708L13 5.793V2.5a.5.5 0 0 0-.5-.5h-1a.5.5 0 0 0-.5.5v1.293z" />
                    <path d="m8 3.293 6 6V13.5a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 2 13.5V9.293z" />
                </svg> Pokédex
            </a>
            <a class="nav-link" href="#" id="filtrar">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-search"
                    viewBox="0 0 16 16">
                    <path
                        d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0" />
                </svg> Filtrar
            </a>
            <div class="nav-separator" style="margin-left:auto; margin-right:0;"></div>
    
            <!-- Dropdown Mi cuenta -->
            <div class="dropdown">
                <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                        class="bi bi-person-circle" viewBox="0 0 16 16">
                        <path d="M11 6a3 3 0 1 1-6 0 3 3 0 0 1 6 0" />
                        <path fill-rule="evenodd"
                            d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8m8-7a7 7 0 0 0-5.468 11.37C3.242 11.226 4.805 10 8 10s4.757 1.225 5.468 2.37A7 7 0 0 0 8 1" />
                    </svg> Mi cuenta
                </a>
                <ul class="dropdown-menu dropdown-menu-end">
                    <li id="miEquipo">
                        <a class="dropdown-item" href="#">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                                class="bi bi-hammer" viewBox="0 0 16 16">
                                <path
                                    d="M9.972 2.508a.5.5 0 0 0-.16-.556l-.178-.129a5 5 0 0 0-2.076-.783C6.215.862 4.504 1.229 2.84 3.133H1.786a.5.5 0 0 0-.354.147L.146 4.567a.5.5 0 0 0 0 .706l2.571 2.579a.5.5 0 0 0 .708 0l1.286-1.29a.5.5 0 0 0 .146-.353V5.57l8.387 8.873A.5.5 0 0 0 14 14.5l1.5-1.5a.5.5 0 0 0 .017-.689l-9.129-8.63c.747-.456 1.772-.839 3.112-.839a.5.5 0 0 0 .472-.334" />
                            </svg> Mis equipos</a>
                    </li>
                    <li>
                        <hr class="dropdown-divider my-1">
                    </li>
                    <li id="cerrarSesion">
                        <a class="dropdown-item danger" href="#">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                                class="bi bi-box-arrow-left" viewBox="0 0 16 16">
                                <path fill-rule="evenodd"
                                    d="M6 12.5a.5.5 0 0 0 .5.5h8a.5.5 0 0 0 .5-.5v-9a.5.5 0 0 0-.5-.5h-8a.5.5 0 0 0-.5.5v2a.5.5 0 0 1-1 0v-2A1.5 1.5 0 0 1 6.5 2h8A1.5 1.5 0 0 1 16 3.5v9a1.5 1.5 0 0 1-1.5 1.5h-8A1.5 1.5 0 0 1 5 12.5v-2a.5.5 0 0 1 1 0z" />
                                <path fill-rule="evenodd"
                                    d="M.146 8.354a.5.5 0 0 1 0-.708l3-3a.5.5 0 1 1 .708.708L1.707 7.5H10.5a.5.5 0 0 1 0 1H1.707l2.147 2.146a.5.5 0 0 1-.708.708z" />
                            </svg> Cerrar sesión</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Contenido -->
    <div class="fade-in" id="divPrincipal">
        <div id="spinnerCarga" class="d-flex justify-content-center align-items-center">
            <div class="spinner-border text-warning" role="status" id="spinnerIndex">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>
        <div id="areaPersonal" class="d-flex"></div>
        <div id="cardsContainer" class="d-grid align-items-baseline"></div>
        <div id="paginationContainer" class="mt-2 mb-2"></div>
    </div>

    <!-- Modal salto de página -->
    <div class="modal fade" id="modalSaltoPagina" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Ir a página</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="number" class="form-control" id="inputPagina" placeholder="Número de página">
                    <small id="errorPagina" class="text-danger d-none">Número inválido</small>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" id="btnIrPagina">Ir</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Filtros -->
    <div class="modal fade" id="modalFiltros" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Filtros Pokémon</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <h6>Tipos</h6>
                    <div id="filtroTipos" class="d-grid gap-2 mb-4 divFiltro"></div>
                    <h6>Generaciones</h6>
                    <div id="filtroGeneraciones" class="d-grid gap-2 mb-4 divFiltro"></div>
                    <h6>Ordenar por</h6>
                    <select id="ordenSelect" class="form-select">
                        <option value="">Sin ordenar</option>
                        <option value="az">Nombre A - Z</option>
                        <option value="za">Nombre Z - A</option>
                        <option value="id-asc">ID menor - mayor</option>
                        <option value="id-desc">ID mayor - menor</option>
                    </select>
                </div>
                <div class="modal-footer justify-content-between">
                    <button type="button" class="btn btn-outline-danger" id="resetFiltros">Reiniciar filtros</button>
                    <button type="button" class="btn btn-primary" id="aplicarFiltros">Aplicar filtros</button>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
