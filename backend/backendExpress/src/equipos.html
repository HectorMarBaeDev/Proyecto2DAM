    <!-- Contenido -->
    <div id="equiposView" class="container-fluid py-4 px-4">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Mis Equipos</h2>
            <button class="btn btn-success d-flex align-items-center" id="btnNuevoEquipo"><svg
                    xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                    class="bi bi-plus-square-fill me-2" viewBox="0 0 16 16">
                    <path
                        d="M2 0a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V2a2 2 0 0 0-2-2zm6.5 4.5v3h3a.5.5 0 0 1 0 1h-3v3a.5.5 0 0 1-1 0v-3h-3a.5.5 0 0 1 0-1h3v-3a.5.5 0 0 1 1 0" />
                </svg> Nuevo equipo</button>
        </div>

        <div id="formNuevoEquipo" class="card p-3 mb-4 d-none">
            <h5>Crear nuevo equipo</h5>
            <div class="row g-2">
                <div class="col-md-5">
                    <input type="text" class="form-control" id="inputNombreEquipo" placeholder="Nombre del equipo">
                </div>
                <div class="col-md-4">
                    <input type="text" class="form-control" id="inputFormatoEquipo"
                        placeholder="Formato (ej: OU, VGC...)">
                </div>
                <div class="col-md-3 d-flex gap-2">
                    <button class="btn btn-success flex-fill" id="btnGuardarEquipo">Guardar</button>
                    <button class="btn btn-secondary flex-fill" id="btnCancelarEquipo">Cancelar</button>
                </div>
            </div>
            <div id="errorCrearEquipo" class="alert alert-danger d-none mt-2 py-2"></div>
        </div>

        <div id="spinnerEquipos" class="d-flex justify-content-center my-4">
            <div class="spinner-border text-warning" role="status">
                <span class="visually-hidden">Cargando...</span>
            </div>
        </div>

        <div id="listaEquipos" class="row g-4 d-none"></div>
        <p id="sinEquipos" class="text-center text-muted fs-5 d-none">No tienes ningún equipo. ¡Crea uno!</p>
    </div>

    <!-- Modal detalle de equipo -->
    <div class="modal fade" id="modalEquipo" tabindex="-1">
        <div class="modal-dialog modal-xl modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalEquipoTitulo">Equipo</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="pokemonDelEquipo" class="row g-3 mb-4"></div>
                    <div id="addPokemonSection">
                        <hr>
                        <h6>Añadir Pokémon <span id="contadorPokemon" class="badge bg-secondary"></span></h6>
                        <div class="d-flex gap-2 mt-2">
                            <input type="text" class="form-control" id="inputBuscarPokemon"
                                placeholder="Nombre o número del Pokémon...">
                            <button class="btn btn-primary" id="btnAnadirPokemon">Añadir</button>
                        </div>
                        <div id="errorAnadirPokemon" class="alert alert-danger d-none mt-2 py-2"></div>
                    </div>
                </div>
                <div class="modal-footer justify-content-between">
                    <button class="btn btn-danger" id="btnEliminarEquipo">Eliminar equipo</button>
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="toastEquipos" class="toast align-items-center text-bg-success border-0" role="alert">
            <div class="d-flex">
                <div class="toast-body" id="toastEquiposBody"></div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
        </div>
    </div>

</body>

</html>
