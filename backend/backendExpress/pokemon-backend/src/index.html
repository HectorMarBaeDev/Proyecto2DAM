<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplicación Pokemon Escritorio</title>
    <link rel="stylesheet" href="./css/bootstrap.css">
    <link rel="stylesheet" href="./css/styles.css">
    <script src="./js/bootstrap.bundle.js" defer></script>
    <script src="./js/functions.js" defer></script>
</head>

<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary d-block navPrincipal">
        <div class="container-fluid d-flex flex-column nav-header">
            <img src="./sources/icono_app.png" alt="Icono de la aplicación escritorio" id="imgLogo">
            <h1 id="tituloApp">PokeBuild</h1>
        </div>
        <div class="container-fluid nav-menu">
            <a class="navbar-brand" href="inicio.html">Inicio</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="#">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" id="filtrar">Filtrar</a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown"
                            aria-expanded="false">Mi cuenta</a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="#">Mi equipo</a></li>
                            <li><a class="dropdown-item" href="#">Cerrar sesión</a></li>
                        </ul>
                    </li>
                </ul>
                <form class="d-flex" role="search" id="searchForm">
                    <input class="form-control me-2" type="search" placeholder="Buscar pokémon..." aria-label="Search"
                        id="searchInput" />
                    <button class="btn btn-outline-success" type="submit">Buscar</button>
                </form>
            </div>
        </div>
    </nav>
    <div class="fade-in" id="divPrincipal">
        <div id="spinnerCarga" class="d-flex justify-content-center align-items-center">
            <div class="spinner-border text-warning" role="status" id="spinnerIndex">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>

        <div id="cardsContainer" class="d-grid align-items-baseline"></div>
        <div id="paginationContainer" class="mt-2 mb-2"></div>
    </div>


    <!-- Modal para salto de página -->
    <div class="modal fade" id="modalSaltoPagina" tabindex="-1" aria-labelledby="modalSaltoPaginaLabel"
        aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalSaltoPaginaLabel">Ir a página</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <input type="number" class="form-control" id="inputPagina" placeholder="Número de página">
                    <small id="errorPagina" class="text-danger d-none">Número inválido</small>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" id="btnIrPagina">Ir</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Filtros -->
    <div class="modal fade" id="modalFiltros" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title">Filtros Pokémon</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">

                    <!-- TIPOS -->
                    <h6>Tipos</h6>
                    <div id="filtroTipos" class="d-grid gap-2 mb-4 divFiltro"></div>

                    <!-- GENERACIONES -->
                    <h6>Generaciones</h6>
                    <div id="filtroGeneraciones" class="d-grid gap-2 mb-4 divFiltro"></div>

                    <!-- ORDEN -->
                    <h6>Ordenar por</h6>
                    <select id="ordenSelect" class="form-select">
                        <option value="">Sin ordenar</option>
                        <option value="az">Nombre A - Z</option>
                        <option value="za">Nombre Z - A</option>
                        <option value="id-asc">ID menor - mayor</option>
                        <option value="id-desc">ID mayor - menor</option>
                    </select>

                </div>

                <div class="modal-footer justify-content-between">
                    <button type="button" class="btn btn-outline-danger" id="resetFiltros">
                        Reiniciar filtros
                    </button>

                    <button type="button" class="btn btn-primary" id="aplicarFiltros">Aplicar filtros</button>
                </div>

            </div>
        </div>
    </div>

</body>

</html>
