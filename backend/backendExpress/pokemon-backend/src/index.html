<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplicación Pokemon Escritorio</title>
    <link rel="stylesheet" href="./css/bootstrap.css">
    <link rel="stylesheet" href="./css/styles.css">
    <script src="./js/bootstrap.bundle.js" defer></script>
    <script src="./js/functions.js" defer></script>
</head>

<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary d-block navPrincipal">
        <div class="container-fluid d-flex flex-column nav-header">
            <img src="./sources/icono_app.png" alt="Icono de la aplicación escritorio" id="imgLogo">
            <h1 id="tituloApp">PokeBuild</h1>
        </div>
        <div class="container-fluid nav-menu">
            <a class="navbar-brand" href="inicio.html">Inicio</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="#">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Link</a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown"
                            aria-expanded="false">
                            Dropdown
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="#">Action</a></li>
                            <li><a class="dropdown-item" href="#">Another action</a></li>
                            <li>
                                <hr class="dropdown-divider">
                            </li>
                            <li><a class="dropdown-item" href="#">Something else here</a></li>
                        </ul>
                    </li>
                </ul>
                <form class="d-flex" role="search" id="searchForm">
                    <input class="form-control me-2" type="search" placeholder="Buscar pokémon..." aria-label="Search" id="searchInput"/>
                    <button class="btn btn-outline-success" type="submit">Buscar</button>
                </form>
            </div>
        </div>
    </nav>
<div class="fade-in" id="divPrincipal">
    <div id="cardsContainer" class="d-grid align-items-baseline"></div>
    <div id="paginationContainer"></div>
</div>


    <!-- Modal para salto de página -->
<div class="modal fade" id="modalSaltoPagina" tabindex="-1" aria-labelledby="modalSaltoPaginaLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalSaltoPaginaLabel">Ir a página</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>
      <div class="modal-body">
        <input type="number" class="form-control" id="inputPagina" placeholder="Número de página">
        <small id="errorPagina" class="text-danger d-none">Número inválido</small>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-primary" id="btnIrPagina">Ir</button>
      </div>
    </div>
  </div>
</div>

</body>

</html>
