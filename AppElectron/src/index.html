<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokeBuilder</title>
    <link rel="stylesheet" href="./css/bootstrap.css">
    <link rel="stylesheet" href="./css/styles.css">

            <!-- Buscador -->

                <input class="form-control" type="search" placeholder="Buscar pokémon..." id="searchInput">
                <button class="btn-buscar" type="submit">Buscar</button>

            <!-- Usuario -->
            <div id="navUserInfo"></div>

        <!-- Franja inferior: navegación -->

            </a>
            <a class="nav-link" href="#" id="filtrar">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-search"
                    viewBox="0 0 16 16">
                    <path
                        d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0" />
                </svg> Filtrar
            </a>
            <div class="nav-separator" style="margin-left:auto; margin-right:0;"></div>
    
            <!-- Dropdown Mi cuenta -->
            <div class="dropdown">
                <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                        class="bi bi-person-circle" viewBox="0 0 16 16">
                        <path d="M11 6a3 3 0 1 1-6 0 3 3 0 0 1 6 0" />

                            d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8m8-7a7 7 0 0 0-5.468 11.37C3.242 11.226 4.805 10 8 10s4.757 1.225 5.468 2.37A7 7 0 0 0 8 1" />
                    </svg> Mi cuenta
                </a>
                <ul class="dropdown-menu dropdown-menu-end">
                    <li id="miEquipo">
                        <a class="dropdown-item" href="#">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                                class="bi bi-hammer" viewBox="0 0 16 16">

                            </svg> Mis equipos</a>
                    </li>
                    <li>
                        <hr class="dropdown-divider my-1">
                    </li>
                    <li id="cerrarSesion">
                        <a class="dropdown-item danger" href="#">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                                class="bi bi-box-arrow-left" viewBox="0 0 16 16">

                                    d="M6 12.5a.5.5 0 0 0 .5.5h8a.5.5 0 0 0 .5-.5v-9a.5.5 0 0 0-.5-.5h-8a.5.5 0 0 0-.5.5v2a.5.5 0 0 1-1 0v-2A1.5 1.5 0 0 1 6.5 2h8A1.5 1.5 0 0 1 16 3.5v9a1.5 1.5 0 0 1-1.5 1.5h-8A1.5 1.5 0 0 1 5 12.5v-2a.5.5 0 0 1 1 0z" />
                                <path fill-rule="evenodd"
                                    d="M.146 8.354a.5.5 0 0 1 0-.708l3-3a.5.5 0 1 1 .708.708L1.707 7.5H10.5a.5.5 0 0 1 0 1H1.707l2.147 2.146a.5.5 0 0 1-.708.708z" />

    <!-- Contenido -->
    <div class="fade-in" id="divPrincipal">
        <div id="spinnerCarga" class="d-flex justify-content-center align-items-center">
            <div class="spinner-border text-warning" role="status" id="spinnerIndex">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>
        <div id="areaPersonal" class="d-flex"></div>
        <div id="cardsContainer" class="d-grid align-items-baseline"></div>
        <div id="paginationContainer" class="mt-2 mb-2"></div>
    </div>

    <!-- Modal salto de página -->
    <div class="modal fade" id="modalSaltoPagina" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Ir a página</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="number" class="form-control" id="inputPagina" placeholder="Número de página">
                    <small id="errorPagina" class="text-danger d-none">Número inválido</small>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" id="btnIrPagina">Ir</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Filtros -->
    <div class="modal fade" id="modalFiltros" tabindex="-1">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content filtro-modal-content">

                <div class="modal-header filtro-modal-header">
                    <div class="d-flex align-items-center gap-2">
                        <div class="filtro-header-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" viewBox="0 0 16 16">
                                <path d="M6 10.5a.5.5 0 0 1 .5-.5h3a.5.5 0 0 1 0 1h-3a.5.5 0 0 1-.5-.5m-2-3a.5.5 0 0 1 .5-.5h7a.5.5 0 0 1 0 1h-7a.5.5 0 0 1-.5-.5m-2-3a.5.5 0 0 1 .5-.5h11a.5.5 0 0 1 0 1h-11a.5.5 0 0 1-.5-.5"/>
                            </svg>
                        </div>
                        <h5 class="modal-title mb-0">Filtros</h5>
                        <span id="filtrosActivosChip" class="filtro-activos-chip d-none"></span>
                    </div>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body filtro-modal-body">

                    <!-- Tipos -->
                    <div class="filtro-seccion">
                        <div class="filtro-seccion-label">
                            <svg xmlns="http://www.w3.org/2000/svg" width="11" height="11" fill="currentColor" viewBox="0 0 16 16"><circle cx="8" cy="8" r="7"/></svg>
                            Tipo
                        </div>
                        <!-- checkboxes ocultos para compatibilidad con JS existente -->
                        <div id="filtroTipos" class="d-none"></div>
                        <!-- chips visuales -->
                        <div id="filtroTiposVisual" class="filtro-tipos-grid"></div>
                    </div>

                    <!-- Generaciones -->
                    <div class="filtro-seccion">
                        <div class="filtro-seccion-label">
                            <svg xmlns="http://www.w3.org/2000/svg" width="11" height="11" fill="currentColor" viewBox="0 0 16 16"><path d="M8 3.5a.5.5 0 0 0-1 0V9a.5.5 0 0 0 .252.434l3.5 2a.5.5 0 0 0 .496-.868L8 8.71z"/><path d="M8 16A8 8 0 1 0 8 0a8 8 0 0 0 0 16m7-8A7 7 0 1 1 1 8a7 7 0 0 1 14 0"/></svg>
                            Generación
                        </div>
                        <div id="filtroGeneraciones" class="d-none"></div>
                        <div id="filtroGeneracionesVisual" class="filtro-gen-grid"></div>
                    </div>

                    <!-- Ordenar -->
                    <div class="filtro-seccion">
                        <div class="filtro-seccion-label">
                            <svg xmlns="http://www.w3.org/2000/svg" width="11" height="11" fill="currentColor" viewBox="0 0 16 16"><path d="M3.5 2.5a.5.5 0 0 0-1 0v8.793l-1.146-1.147a.5.5 0 0 0-.708.708l2 1.999.007.007a.497.497 0 0 0 .7-.006l2-2a.5.5 0 0 0-.707-.708L3.5 11.293zm4 1a.5.5 0 0 1 .5-.5h7a.5.5 0 0 1 0 1h-7a.5.5 0 0 1-.5-.5M7.5 6a.5.5 0 0 0 0 1h5a.5.5 0 0 0 0-1zm0 3a.5.5 0 0 0 0 1h3a.5.5 0 0 0 0-1zm0 3a.5.5 0 0 0 0 1h1a.5.5 0 0 0 0-1z"/></svg>
                            Ordenar por
                        </div>
                        <div class="filtro-orden-grid">
                            <button class="filtro-orden-btn active" data-orden="">Sin ordenar</button>
                            <button class="filtro-orden-btn" data-orden="az">Nombre A → Z</button>
                            <button class="filtro-orden-btn" data-orden="za">Nombre Z → A</button>
                            <button class="filtro-orden-btn" data-orden="id-asc">ID ↑ menor → mayor</button>
                            <button class="filtro-orden-btn" data-orden="id-desc">ID ↓ mayor → menor</button>
                        </div>
                        <select id="ordenSelect" class="d-none">
                            <option value="">Sin ordenar</option>
                            <option value="az">Nombre A - Z</option>
                            <option value="za">Nombre Z - A</option>
                            <option value="id-asc">ID menor - mayor</option>
                            <option value="id-desc">ID mayor - menor</option>
                        </select>
                    </div>

                </div>

                <div class="modal-footer filtro-modal-footer">
                    <div class="d-flex align-items-center gap-2">
                        <button type="button" class="btn btn-filtro-reset" id="resetFiltros">
                            <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" fill="currentColor" viewBox="0 0 16 16"><path fill-rule="evenodd" d="M8 3a5 5 0 1 1-4.546 2.914.5.5 0 0 0-.908-.417A6 6 0 1 0 8 2z"/><path d="M8 4.466V.534a.25.25 0 0 0-.41-.192L5.23 2.308a.25.25 0 0 0 0 .384l2.36 1.966A.25.25 0 0 0 8 4.466"/></svg>
                            Reiniciar
                        </button>
                    </div>
                    <button type="button" class="btn btn-filtro-aplicar" id="aplicarFiltros">
                        <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" fill="currentColor" viewBox="0 0 16 16"><path d="M10.97 4.97a.75.75 0 0 1 1.07 1.05l-3.99 4.99a.75.75 0 0 1-1.08.02L4.324 8.384a.75.75 0 1 1 1.06-1.06l2.094 2.093 3.473-4.425z"/></svg>
                        Aplicar filtros
                    </button>
                </div>

            </div>
        </div>
    </div>

</body>
</html>
